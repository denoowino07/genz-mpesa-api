<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        
        .trading-box {
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            padding: 40px 20px;
            width: 95%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }

        .market-status {
            color: #00ff00; 
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 25px;
        }
        
        /* Vifungo vya Jukwaa */
        .action-btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            transition: transform 0.2s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Kitufe cha kufungua Chati ya Deriv */
        .chart-btn {
            background-color: #00bfff;
            color: #ffffff;
        }

        /* Kitufe cha kuweka Pesa */
        .deposit-btn {
            background-color: #00ff00;
            color: #0b0e14;
        }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title">Volatility 10 (1S) Index Market Dashboard</div>

    <div class="trading-box">
        <div class="market-status">Market Status: Active</div>
        
        <!-- Kitufe hiki kinafungua Grafu rasmi ya Deriv kwenye ukurasa mpya bila kuzuiliwa na Render -->
        <a href="https://deriv.com" target="_blank" class="action-btn chart-btn">
            Open Volatility 10 Live Chart
        </a>

        <!-- Kitufe cha Amana -->
        <a href="#" class="action-btn deposit-btn">Click to DEPOSIT</a>
    </div>

</body>
</html>
