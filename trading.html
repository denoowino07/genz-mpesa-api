<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222b3c;
        }
        
        .logo { color: #00bfff; font-weight: bold; font-size: 1.4rem; }
        .balance-badge { background-color: #151a24; padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
        .deposit-btn { background-color: #00ff00; color: #0b0e14; padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; }

        /* AINA ZA MASOKO (TOP MENU) */
        .market-modes {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 480px;
            margin: 15px 0;
            gap: 5px;
        }
        .mode-tab {
            background-color: #151a24;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid #222b3c;
            color: #8a919e;
        }
        .mode-tab.active { background-color: #00bfff; color: #ffffff; border-color: #00bfff; }

        .trading-box {
            background-color: #151a24;
            border: 1px solid #222b3c;
            border-radius: 12px;
            padding: 15px;
            width: 95%;
            max-width: 480px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* LIVE CHART & TICK SYSTEM */
        .chart-box { background-color: #0b0e14; border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 15px; }
        .price-badge { font-size: 2rem; font-weight: bold; margin: 5px 0; }
        .ticker-container { display: flex; justify-content: center; gap: 5px; margin-top: 10px; overflow-x: auto; }
        .tick-circle { width: 28px; height: 28px; border-radius: 50%; background-color: #222b3c; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
        #chart-canvas { width: 100%; height: 160px; background-color: #0b0e14; }

        /* AUTO / MANUAL CONTROLS */
        .execution-modes { display: flex; width: 100%; gap: 10px; margin-bottom: 15px; }
        .exec-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; background-color: #222b3c; color: #ffffff; }
        .exec-btn.active-manual { background-color: #00ff00; color: #0b0e14; }

        /* TRADE AMOUNT INPUT */
        .stake-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background-color: #0b0e14;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #222b3c;
        }
        .stake-input { background: none; border: none; color: #ffffff; font-size: 1.5rem; width: 80px; text-align: center; font-weight: bold; }
        .math-btn { background-color: #222b3c; color: #ffffff; border: none; width: 35px; height: 35px; border-radius: 6px; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- BAR YA JUU YA ACCOUNT -->
    <div class="header-bar">
        <div class="logo">GENZ TRADING</div>
        <div class="balance-badge">$ 1,396,865.30</div>
        <a href="#" class="deposit-btn" onclick="openDepositPrompt()">DEPOSIT</a>
    </div>

    <!-- 1. AINA ZA MASOKO (ZILIZOPO KWENYE PICHA YAKO) -->
    <div class="market-modes">
        <div class="mode-tab">Matches/Differs</div>
        <div class="mode-tab active">Even/Odd</div>
        <div class="mode-tab">Over/Under</div>
    </div>

    <div class="trading-box">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #8a919e; margin-bottom: 5px;">
            <span>Volatility 10 (1S) Index</span>
            <span style="color: #00ff00;">100% Active</span>
        </div>

        <!-- 2. CHATI NA NUMBA ZINAZORUKA -->
        <div class="chart-box">
            <div class="price-badge" id="live-price">9379.60</div>
            <canvas id="chart-canvas"></canvas>
            
            <div class="ticker-container" id="ticker-box">
                <div class="tick-circle" style="background-color: #00ff00; color: #0b0e14;">0</div>
                <div class="tick-circle">1</div>
                <div class="tick-circle">2</div>
                <div class="tick-circle">3</div>
                <div class="tick-circle">4</div>
                <div class="tick-circle">5</div>
                <div class="tick-circle">6</div>
                <div class="tick-circle">7</div>
                <div class="tick-circle">8</div>
            </div>
        </div>

        <!-- 3. VIFUNGO VYA AUTO / MANUAL -->
        <div class="execution-modes">
            <button class="exec-btn">AUTO</button>
            <button class="exec-btn active-manual">MANUAL</button>
        </div>

        <!-- 4. SEHEMU YA WEKA KIASI CHA PESA ($ 10) -->
        <div class="stake-box">
            <button class="math-btn" onclick="adjustStake(-1)">-</button>
            <span style="color: #8a919e; font-size: 1.2rem;">$</span>
            <input type="number" class="stake-input" id="stake-value" value="10" readonly>
            <button class="math-btn" onclick="adjustStake(1)">+</button>
        </div>
    </div>

    <script>
        function openDepositPrompt() {
            alert("M-Pesa Gateway: Enter your details to top up your Genz Trading Wallet.");
        }

        function adjustStake(amount) {
            const input = document.getElementById('stake-value');
            let current = parseInt(input.value);
            if (current + amount >= 1) {
                input.value = current + amount;
            }
        }

        // INIJA YA KUZUNGUSHA CHATI NA NUMBA (Bypass Seva Blocks)
        const priceText = document.getElementById('live-price');
        const tickerBox = document.getElementById('ticker-box');
        const canvas = document.getElementById('chart-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = canvas.parentElement.clientWidth - 20;
        canvas.height = 160;

        let basePrice = 9379.60;
        let points = Array(25).fill(80);

        setInterval(() => {
            let change = (Math.random() - 0.5) * 3;
            basePrice += change;
            priceText.innerText = basePrice.toFixed(2);
            priceText.style.color = change > 0 ? "#00ff00" : "#ff4a5a";

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            points.shift();
            points.push(80 - (change * 12));
            
            ctx.beginPath();
            ctx.strokeStyle = change > 0 ? "#00ff00" : "#ff4a5a";
            ctx.lineWidth = 3;
            
            let step = canvas.width / (points.length - 1);
            for(let i=0; i<points.length; i++) {
                let x = i * step;
                let y = canvas.height/2 + (points[i] - 80);
                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            const circles = tickerBox.getElementsByClassName('tick-circle');
            let luckyIndex = Math.floor(Math.random() * circles.length);
            for(let i=0; i<circles.length; i++) {
                circles[i].style.backgroundColor = (i === luckyIndex) ? (change > 0 ? "#00ff00" : "#ff4a5a") : "#222b3c";
                circles[i].style.color = (i === luckyIndex) ? "#0b0e14" : "#ffffff";
            }
        }, 1000);
    </script>
</body>
</html>
