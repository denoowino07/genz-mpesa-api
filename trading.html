<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        .chart-container {
            width: 100%;
            max-width: 800px;
            height: 450px;
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title">Volatility 10 (1S) Index Real-Time Chart</div>

    <!-- TradingView Chart Widget Section -->
    <div class="chart-container">
        <div id="tradingview_chart"></div>
    </div>

    <!-- Load TradingView Library -->
    <script type="text/javascript" src="https://tradingview.com"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "width": "100%",
            "height": "100%",
            "symbol": "DERIV:1HZ10V", // This is Volatility 10 (1S) Index from Deriv
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_chart"
        });
    </script>

</body>
</html>
