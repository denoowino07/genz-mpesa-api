<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform - GenzTrending</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Tunavuta Library halisi inayotengeneza Chati za Kawaida za kitaalamu -->
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --bg-color: #0c1017;
            --card-bg: #161d26;
            --primary-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #8492a6;
            --border-color: #242f3d;
            --danger-red: #ff4a4a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); font-size: 14px; padding: 15px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #11171f; border-bottom: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; }
        .account-badge { background-color: #1e293b; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .btn-action { color: #000; font-weight: 700; padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }

        .market-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .asset-price { font-size: 26px; font-weight: 800; font-family: monospace; }

        /* BOX LA CHATI YA KAWAIDA YA KITAALAMU */
        .chart-wrapper { background-color: #11171f; border: 1px solid var(--border-color); border-radius: 12px; height: 230px; width: 100%; padding: 5px; margin-bottom: 15px; overflow: hidden; }
        #professionalChart { width: 100%; height: 100%; }

        /* Vijiduara vya namba 0-9 kama majukwaa halisi */
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 15px; }
        .stat-bubble { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px; text-align: center; font-size: 12px; }
        .bubble-num { background-color: #2196f3; color: #fff; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; margin-bottom: 2px; }
        .bubble-pct { font-weight: 700; font-size: 11px; }

        .stake-section { background-color: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        .amount-control { display: flex; justify-content: space-between; align-items: center; background-color: #0c1017; border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; margin-bottom: 15px; }
        .amt-btn { background: #1c2633; border: none; color: #ff9100; font-size: 20px; font-weight: 700; width: 38px; height: 36px; border-radius: 6px; cursor: pointer; }
        .amt-val { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: 700; text-align: center; width: 100%; outline: none; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-trade { border: none; padding: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <header>
        <div class="account-badge">
            <select id="account-type" onchange="toggleWallet()" style="background:transparent; color:#ffa726; border:none; font-weight:800; outline:none; cursor:pointer;">
                <option value="demo" style="background:#161d26; color:#fff;">Demo (D)</option>
                <option value="real" style="background:#161d26; color:#fff;">Real (R)</option>
            </select>
            <span id="wallet-balance">$10,000.00</span>
        </div>
        <div>
            <button class="btn-action" style="background-color: var(--primary-green);" onclick="deposit()">DEPOSIT</button>
            <button class="btn-action" style="background-color: #e2e8f0; color:#000;" onclick="withdraw()">WITHDRAW</button>
        </div>
    </header>

    <div class="market-box">
        <div>
            <span style="font-size: 11px; color: var(--text-muted); display:block;">VOLATILITY 10 (1S) INDEX</span>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="asset-price" id="live-price">9379.00</span>
                <span id="live-arrow" style="font-size:20px;">▲</span>
            </div>
        </div>
        <div id="tick-counter" style="font-weight:700; color:var(--primary-green); font-size:13px;">Tick: 5</div>
    </div>

    <!-- CHATI YA KAWAIDA YA KITAALAMU YA MISTARI NA GRIDI YA NYUMA -->
    <div class="chart-wrapper">
        <div id="professionalChart"></div>
    </div>

    <!-- Vijiduara vya takwimu (0-9) kama vipo kwenye picha uliyotuma mwanzo -->
    <div class="stats-grid">
        <div class="stat-bubble"><span class="bubble-num" style="background:var(--primary-green)">0</span><div class="bubble-pct">12%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">1</span><div class="bubble-pct">10%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">2</span><div class="bubble-pct">9%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">3</span><div class="bubble-pct">11%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">4</span><div class="bubble-pct">8%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">5</span><div class="bubble-pct">13%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">6</span><div class="bubble-pct">10%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">7</span><div class="bubble-pct">7%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">8</span><div class="bubble-pct">11%</div></div>
        <div class="stat-bubble"><span class="bubble-num" style="background:#242f3d">9</span><div class="bubble-pct">9%</div></div>
    </div>

    <div class="stake-section">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:600;">
            <span style="color: var(--text-muted);">Payout: <span style="color: var(--primary-green);">+95%</span></span>
            <span id="pnl-display" style="font-size:13px;">Last Trade: $0.00</span>
        </div>
        <div class="amount-control">
            <button class="amt-btn" onclick="adjust(-1)">−</button>
            <input type="number" class="amt-val" id="trade-amount" value="10">
            <button class="amt-btn" onclick="adjust(1)">+</button>
        </div>
        <div class="action-btns">
            <button class="btn-trade" style="background-color: var(--primary-green); color:#000;" onclick="trade('BUY')">▲ BUY</button>
            <button class="btn-trade" style="background-color: var(--danger-red); color:#fff;" onclick="trade('SELL')">▼ SELL</button>
        </div>
    </div>

    <script>
        let wallets = { demo: 10000.00, real: 0.00 };
        function toggleWallet() {
            const type = document.getElementById('account-type').value;
            document.getElementById('wallet-balance').innerText = '$' + wallets[type].toFixed(2);
        }

        // SETUP YA CHATI HALISI YA TRADINGVIEW LIGHTWEIGHT
        const chartElement = document.getElementById('professionalChart');
        const chart = LightweightCharts.createChart(chartElement, {
            layout: { backgroundColor: '#11171f', textColor: '#8492a6', fontSize: 10 },
            grid: { vertLines: { color: '#1c2633' }, horzLines: { color: '#1c2633' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#242f3d' },
            timeScale: { visible: false }
        });

        const lineSeries = chart.addAreaSeries({
            topColor: 'rgba(0, 230, 118, 0.3)',
            bottomColor: 'rgba(0, 230, 118, 0.0)',
            lineColor: '#00e676',
            lineWidth: 2,
            crosshairMarkerVisible: true
        });

        // Kutengeneza pointi za mwanzo za soko
        let timeStamp = Math.floor(Date.now() / 1000);
        let chartPoints = [];
        let startingPrice = 9379.00;
        for (let i = 0; i < 50; i++) {
            chartPoints.push({ time: timeStamp + i, value: startingPrice + (Math.random() - 0.5) * 10 });
        }
        lineSeries.setData(chartPoints);

        // INJINI YA LIVE PRICE KUKIMBIA KWA KASI YA SEKUNDE (TICKS)
        let price = startingPrice;
        let runningTime = timeStamp + 50;
        setInterval(() => {
            let drift = (Math.random() - 0.5) * 4;
            let old = price; price += drift;

            document.getElementById('live-price').innerText = price.toFixed(2);
            document.getElementById('live-arrow').innerText = price > old ? "▲" : "▼";
            document.getElementById('live-arrow').style.color = price > old ? "var(--primary-green)" : "var(--danger-red)";
            document.getElementById('live-price').style.color = price > old ? "var(--primary-green)" : "var(--danger-red)";
            document.getElementById('tick-counter').innerText = "Tick: " + Math.floor(Math.random() * 10);
            
            // Sasisha chati ya kitaalamu kwa sekunde hiyo hiyo
            runningTime++;
