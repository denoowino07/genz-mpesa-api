<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform - GenzTrending</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg-color: #0c1017; --card-bg: #161d26; --primary-green: #00e676; --text-main: #ffffff; --text-muted: #8492a6; --border-color: #242f3d; --danger-red: #ff4a4a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); font-size: 14px; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #11171f; border-bottom: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; }
        .account-badge { background-color: #1e293b; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .btn-action { color: #000; font-weight: 700; padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
        .market-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .asset-price { font-size: 28px; font-weight: 800; font-family: monospace; }
        .chart-container { background-color: #11171f; border: 1px solid var(--border-color); border-radius: 12px; height: 180px; width: 100%; padding: 10px; margin-bottom: 20px; }
        canvas { width: 100%; height: 100%; display: block; }
        .stake-section { background-color: #161d26; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .amount-control { display: flex; justify-content: space-between; align-items: center; background-color: #0c1017; border: 1px solid var(--border-color); border-radius: 8px; padding: 5px; margin-bottom: 15px; }
        .amt-btn { background: #1c2633; border: none; color: #ff9100; font-size: 20px; font-weight: 700; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; }
        .amt-val { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: 700; text-align: center; width: 100%; outline: none; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-trade { border: none; padding: 18px; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <div class="account-badge">
            <select id="account-type" onchange="toggleWallet()" style="background:transparent; color:#ffa726; border:none; font-weight:800; outline:none; cursor:pointer;">
                <option value="demo" style="background:#161d26; color:#fff;">Demo (D)</option>
                <option value="real" style="background:#161d26; color:#fff;">Real (R)</option>
            </select>
            <span id="wallet-balance">$10,000.00</span>
        </div>
        <div>
            <button class="btn-action" style="background-color: var(--primary-green);" onclick="deposit()">DEPOSIT</button>
            <button class="btn-action" style="background-color: #e2e8f0; color:#000;" onclick="withdraw()">WITHDRAW</button>
        </div>
    </header>

    <div class="market-box">
        <div>
            <span style="font-size: 12px; color: var(--text-muted);">VOLATILITY 10 (1S) INDEX</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <span class="asset-price" id="live-price">9379.00</span>
                <span id="live-arrow" style="font-size:24px;">▲</span>
            </div>
        </div>
        <div id="tick-counter" style="font-weight:700; color:var(--primary-green);">Tick: 5</div>
    </div>

    <div class="chart-container"><canvas id="fastCanvasChart"></canvas></div>

    <div class="stake-section">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:600;">
            <span style="color: var(--text-muted);">Payout: <span style="color: var(--primary-green);">+95%</span></span>
            <span id="pnl-display">Last Trade: $0.00</span>
        </div>
        <div class="amount-control">
            <button class="amt-btn" onclick="adjust(-1)">−</button>
            <input type="number" class="amt-val" id="trade-amount" value="10">
            <button class="amt-btn" onclick="adjust(1)">+</button>
        </div>
        <div class="action-btns">
            <button class="btn-trade" style="background-color: var(--primary-green); color:#000;" onclick="trade('BUY')">▲ BUY</button>
            <button class="btn-trade" style="background-color: var(--danger-red); color:#fff;" onclick="trade('SELL')">▼ SELL</button>
        </div>
    </div>

    <script>
        let wallets = { demo: 10000.00, real: 0.00 };
        function toggleWallet() {
            const type = document.getElementById('account-type').value;
            document.getElementById('wallet-balance').innerText = '$' + wallets[type].toFixed(2);
        }

        const canvas = document.getElementById('fastCanvasChart');
        const ctx = canvas.getContext('2d');
        let points = Array(25).fill(9379.00);

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let min = Math.min(...points) - 1, max = Math.max(...points) + 1, range = max - min;
            ctx.beginPath(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
            for (let i = 0; i < points.length; i++) {
                let x = (canvas.width / (points.length - 1)) * i;
                let y = canvas.height - ((points[i] - min) / range) * canvas.height;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        let price = 9379.00;
        setInterval(() => {
            let drift = (Math.random() - 0.5) * 4;
            let old = price; price += drift;
            document.getElementById('live-price').innerText = price.toFixed(2);
            document.getElementById('live-arrow').innerText = price > old ? "▲" : "▼";
            document.getElementById('live-arrow').style.color = price > old ? "var(--primary-green)" : "var(--danger-red)";
            document.getElementById('live-price').style.color = price > old ? "var(--primary-green)" : "var(--danger-red)";
            document.getElementById('tick-counter').innerText = "Tick: " + Math.floor(Math.random() * 10);
            points.push(price); points.shift(); draw();
        }, 300);

        function trade(dir) {
            const type = document.getElementById('account-type').value;
            const amt = parseFloat(document.getElementById('trade-amount').value);
            if(amt > wallets[type]) { alert("Insufficient funds!"); return; }
            
            document.getElementById('pnl-display').innerText = "Processing...";
            fetch('/api/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amt })
            }).then(res => res.json()).then(data => {
                wallets[type] += data.pnl;
                toggleWallet();
                document.getElementById('pnl-display').innerText = data.result + ": " + (data.pnl > 0 ? "+$" : "-$") + Math.abs(data.pnl).toFixed(2);
                document.getElementById('pnl-display').style.color = data.result === "WIN" ? "var(--primary-green)" : "var(--danger-red)";
            });
        }

        function deposit() {
            let phone = prompt("Enter Safaricom Number:");
            let amt = prompt("Amount in USD:", "10");
            if(phone && amt) { wallets.real += parseFloat(amt); toggleWallet(); alert("Deposit success!"); }
        }
        function withdraw() {
            let phone = prompt("Enter M-Pesa Number:");
            let amt = prompt("Amount in USD:");
            const type = document.getElementById('account-type').value;
            if(wallets[type] >= parseFloat(amt)) { wallets[type] -= parseFloat(amt); toggleWallet(); alert("Withdrawal processing!"); }
            else { alert("Insufficient funds!"); }
        }
        function adjust(v) { let input = document.getElementById('trade-amount'); input.value = Math.max(1, parseFloat(input.value) + v); }
        window.addEventListener('resize', () => { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; draw(); });
        canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight;
    </script>
</body>
</html>
