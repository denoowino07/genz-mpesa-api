<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenZ Trading Platform</title>
    <!-- Pakia maktaba ya chati (ApexCharts) -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #121824;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            background: #1c2434;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2e3b52;
            padding-bottom: 10px;
        }
        .price-display {
            font-size: 24px;
            font-weight: bold;
            color: #00e676;
        }
        #chart {
            width: 100%;
            height: 350px;
            margin: 20px 0;
        }
        .trade-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            background: #131a26;
            padding: 15px;
            border-radius: 8px;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="number"] {
            background: #1c2434;
            border: 1px solid #2e3b52;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            width: 100px;
            text-align: center;
        }
        .btn-container {
            display: flex;
            gap: 20px;
            width: 100%;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-buy { background-color: #00c853; color: white; }
        .btn-buy:hover { background-color: #00e676; }
        .btn-sell { background-color: #ff3d00; color: white; }
        .btn-sell:hover { background-color: #ff6e40; }
        #status-message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Volatility 10 (1s) Index</h2>
        <div class="price-display" id="live-price">Inapakia...</div>
    </div>

    <!-- Hapa ndipo chati inapochorwa -->
    <div id="chart"></div>

    <!-- Jopo la kuweka Trade -->
    <div class="trade-panel">
        <div class="input-group">
            <label>Kiasi ($):</label>
            <input type="number" id="stake-amount" value="10" min="1">
            <span style="color: #888;">(Muda: 5 Ticks)</span>
        </div>
        
        <div class="btn-container">
            <button class="btn-buy" onclick="placeTrade('CALL')">▲ BUY</button>
            <button class="btn-sell" onclick="placeTrade('PUT')">▼ SELL</button>
        </div>
        <div id="status-message"></div>
    </div>
</div>

<script>
    // 1. Sanidi Chati ya ApexCharts (Mstari wa Ticks za Live)
    let chartData = [];
    let chartOptions = {
        series: [{ name: 'Bei', data: chartData }],
        chart: { type: 'line', height: 350, animations: { enabled: true, easing: 'linear', dynamicAnimation: { speed: 1000 } }, toolbar: { show: false } },
        stroke: { curve: 'smooth', width: 3, colors: ['#00e676'] },
        xaxis: { type: 'numeric', labels: { show: false } },
        yaxis: { labels: { style: { colors: '#fff' } }, forceNiceScale: true },
        grid: { borderColor: '#2e3b52' }
    };
    
    let chart = new ApexCharts(document.querySelector("#chart"), chartOptions);
    chart.render();

    // 2. Unganisha na Deriv API WebSocket kupata bei halisi za soko
    const ws = new WebSocket('wss://://binaryws.com'); // App ID ya majaribio ya Deriv

    ws.onopen = function() {
        // Omba kupewa bei ya soko kila sekunde (Volatility 10 Index)
        ws.send(JSON.stringify({ ticks: 'R_10' }));
    };

    ws.onmessage = function(msg) {
        let response = JSON.parse(msg.data);
        
        if (response.tick) {
            let currentPrice = response.tick.quote;
            let time = response.tick.epoch;

            // Update bei kwenye kioo
            document.getElementById('live-price').innerText = currentPrice;

            // Sukuma data mpya kwenye chati
            chartData.push({ x: time, y: currentPrice });
            if (chartData.length > 20) chartData.shift(); // Weka rekodi 20 tu ili chati isikwame

            chart.updateSeries([{ data: chartData }]);
        }
    };

    // 3. Kazi ya kutuma oda ya mteja kwenda kwenye Backend yako (server.js)
    async function placeTrade(direction) {
        const amount = document.getElementById('stake-amount').value;
        const statusBox = document.getElementById('status-message');
        statusBox.innerHTML = `Inatuma oda ya ${direction} ya $${amount}...`;
        statusBox.style.color = "#ffeb3b";

        try {
            const response = await fetch('/api/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ direction: direction, amount: amount, asset: 'R_10' })
            });
            const result = await response.json();
            
            if(result.success) {
                statusBox.innerHTML = `Oda imekubaliwa! ID: ${result.tradeId}`;
                statusBox.style.color = "#00e676";
            } else {
                statusBox.innerHTML = `Oda imekataliwa: ${result.message}`;
                statusBox.style.color = "#ff3d00";
            }
        } catch (error) {
            statusBox.innerHTML = "Imefeli kuunganisha na seva!";
            statusBox.style.color = "#ff3d00";
        }
    }
</script>
</body>
</html>
