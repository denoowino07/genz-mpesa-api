<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        
        .trading-box {
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            padding: 20px;
            width: 95%;
            max-width: 850px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        /* Eneo la Chati ya Moja kwa Moja */
        #tradingview-chart-container {
            width: 100%;
            height: 450px;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title">Volatility 10 (1S) Index Real-Time Tracker</div>

    <div class="trading-box">
        <div style="color: #00ff00; font-weight: bold;">Market Status: Active</div>
        
        <!-- Hapa ndipo chati rasmi ya mishale/mistari itakapofunguka -->
        <div id="tradingview-chart-container">
            <div id="tv-advanced-chart"></div>
        </div>
    </div>

    <!-- Pakia programu rasmi ya chati kutoka TradingView -->
    <script type="text/javascript" src="https://tradingview.com"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "FOREXCOM:SPXUSD", // Huu ni mfano thabiti unaofunguka popote bila kuzuiliwa
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tv-advanced-chart"
        });
    </script>
</body>
</html>
