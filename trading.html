<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin: 5px 0; font-size: 1.8rem; }
        .market-title { color: #8a919e; font-size: 1rem; margin-bottom: 15px; }
        
        .trading-box {
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            padding: 20px 15px;
            width: 95%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Form Styling */
        .form-group { text-align: left; margin-bottom: 15px; width: 90%; margin-left: auto; margin-right: auto; }
        label { display: block; margin-bottom: 5px; color: #8a919e; font-size: 0.9rem; }
        input {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748;
            background-color: #0b0e14; color: #ffffff; font-size: 1rem; box-sizing: border-box;
        }
        input:focus { border-color: #00bfff; outline: none; }

        .btn {
            width: 90%; background-color: #00bfff; color: #ffffff; padding: 14px;
            border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .deposit-btn { background-color: #00ff00; color: #0b0e14; }
        .switch-link { margin-top: 15px; font-size: 0.9rem; color: #00bfff; cursor: pointer; }
        .hidden { display: none; }

        /* LIVE CHART & TICK SYSTEM */
        .chart-box {
            background-color: #0b0e14; border: 1px solid #222b3c; border-radius: 8px;
            padding: 15px; margin: 15px 0; text-align: center; position: relative;
        }
        .price-badge { font-size: 2.2rem; font-weight: bold; margin: 5px 0; color: #ffffff; }
        .ticker-container {
            display: flex; justify-content: center; gap: 8px; margin-top: 15px; overflow-x: auto; padding: 5px;
        }
        .tick-circle {
            width: 32px; height: 32px; border-radius: 50%; background-color: #222b3c;
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold;
        }
        #chart-canvas { width: 100%; height: 180px; margin-top: 10px; background-color: #0b0e14; }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title" id="page-title">Real-Time Copy Trading Portal</div>

    <div class="trading-box">
        
        <!-- 1. UKURASA WA LOGIN -->
        <div id="login-section">
            <h2>Account Login</h2>
            <form onsubmit="showDashboard(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn">Login to Platform</button>
            </form>
            <div class="switch-link" onclick="toggleForm('register')">New to Genz? Sign Up here</div>
        </div>

        <!-- 2. UKURASA WA REGISTER -->
        <div id="register-section" class="hidden">
            <h2>Create Free Account</h2>
            <form onsubmit="showDashboard(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Official Names" required>
                </div>
                <div class="form-group">
                    <label>M-Pesa Phone Number</label>
                    <input type="tel" placeholder="e.g. 254712345678" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Minimum 6 characters" required>
                </div>
                <button type="submit" class="btn">Register & Connect</button>
            </form>
            <div class="switch-link" onclick="toggleForm('login')">Have an account? Login here</div>
        </div>

        <!-- 3. MAIN DASHBOARD (CHATI, NUMBA ZINAZORUKA, NA M-PESA) -->
        <div id="dashboard-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="color: #00ff00; font-weight: bold;">● Live Market Active</span>
                <span style="color: #8a919e; font-size: 0.9rem;">Vol 10 (1S) Index</span>
            </div>

            <!-- CHATI NA NUMBA ZINAZORUKA (KAMA INAVYONEKANA KWENYE PICHA YAKO) -->
            <div class="chart-box">
                <div class="price-badge" id="live-price">9379.60</div>
                <canvas id="chart-canvas"></canvas>
                
                <!-- Namba za kurukaruka chini ya grafu -->
                <div class="ticker-container" id="ticker-box">
                    <div class="tick-circle" style="background-color: #00ff00; color: #0b0e14;">0</div>
                    <div class="tick-circle">1</div>
                    <div class="tick-circle">2</div>
                    <div class="tick-circle">3</div>
                    <div class="tick-circle">4</div>
                    <div class="tick-circle">5</div>
                    <div class="tick-circle">6</div>
                    <div class="tick-circle">7</div>
                    <div class="tick-circle">8</div>
                </div>
            </div>

            <!-- SEHEMU YA M-PESA DEPOSIT -->
            <div style="border-top: 1px solid #222b3c; padding-top: 15px; margin-top: 15px;">
                <h3 style="margin-top: 0;">Quick M-Pesa Deposit</h3>
                <form onsubmit="triggerPayment(event)">
                    <div class="form-group">
                        <input type="number" id="deposit-amount" placeholder="Enter Amount (Ksh)" min="100" required>
                    </div>
                    <button type="submit" class="btn deposit-btn">Deposit via M-Pesa</button>
                </form>
                <div id="payment-status" style="margin-top: 10px; font-size: 0.9rem; font-weight: bold;"></div>
            </div>
        </div>

    </div>

    <script>
        function toggleForm(page) {
            if(page === 'register') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('register-section').classList.remove('hidden');
            } else {
                document.getElementById('register-section').classList.add('hidden');
                document.getElementById('login-section').classList.remove('hidden');
            }
        }

        function showDashboard(event) {
            event.preventDefault();
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('page-title').innerText = "GENZ Live Trading Dashboard";
            startLiveMarket();
        }

        function triggerPayment(event) {
            event.preventDefault();
            const amount = document.getElementById('deposit-amount').value;
            const statusDiv = document.getElementById('payment-status');
            statusDiv.style.color = "#00ff00";
            statusDiv.innerText = "STK Push of Ksh " + amount + " initialized! Enter M-Pesa PIN on your phone.";
        }

        // SIMULATION YA GRAFU NA NUMBA ZINAZORUKA KILA SEKUNDE (Bypass zote za Render Blocks)
        function startLiveMarket() {
            const priceText = document.getElementById('live-price');
            const tickerBox = document.getElementById('ticker-box');
            const canvas = document.getElementById('chart-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.parentElement.clientWidth - 30;
            canvas.height = 180;

            let basePrice = 9379.60;
            let points = Array(30).fill(100);

            setInterval(() => {
                // 1. Zungusha bei ipande au ishuke
                let change = (Math.random() - 0.5) * 4;
                basePrice += change;
                priceText.innerText = basePrice.toFixed(2);
                priceText.style.color = change > 0 ? "#00ff00" : "#ff4a5a";

                // 2. Chora grafu ya mistari inayotembea live
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                points.shift();
                points.push(100 - (change * 15));
                
                ctx.beginPath();
                ctx.strokeStyle = change > 0 ? "#00ff00" : "#ff4a5a";
                ctx.lineWidth = 3;
                
                let step = canvas.width / (points.length - 1);
                for(let i=0; i<points.length; i++) {
                    let x = i * step;
                    let y = canvas.height/2 + (points[i] - 100);
                    if(i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // 3. Badilisha rangi ya namba za kurukaruka za chini
                const circles = tickerBox.getElementsByClassName('tick-circle');
                let luckyIndex = Math.floor(Math.random() * circles.length);
                for(let i=0; i<circles.length; i++) {
