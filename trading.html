<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        
        .trading-box {
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            padding: 30px 20px;
            width: 95%;
            max-width: 650px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }

        .market-status {
            color: #00ff00; 
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        /* Sanduku la Chati */
        .chart-container {
            width: 100%;
            height: 400px;
            margin: 20px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2d3748;
        }
        
        /* Vifungo */
        .deposit-btn {
            display: inline-block;
            background-color: #00ff00;
            color: #0b0e14;
            padding: 12px 35px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title">Live Market Analytics Dashboard</div>

    <div class="trading-box">
        <div class="market-status">Market Status: Active</div>
        
        <!-- HAPA NIMESPANDISHA CHATI YA LIVE INAYOFUNGUKA PAPO HAPO -->
        <div class="chart-container">
            <iframe src="https://tradingview.com" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>

        <!-- Kitufe cha Amana -->
        <a href="#" class="deposit-btn">Click to DEPOSIT</a>
    </div>

</body>
</html>
