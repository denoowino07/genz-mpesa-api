<!-- The div element where the live chart will be rendered -->
<div id="chart-container" style="width: 100%; height: 400px; margin-top: 20px; border-radius: 8px; overflow: hidden;"></div>

<!-- Load the official TradingView Lightweight Charts library -->
<script src="https://unpkg.com"></script>


<!-- ========================================== -->
<!-- WEBSOCKET INTEGRATION FOR DERIV LIVE DATA  -->
<!-- ========================================== -->
<script>
    // 1. Initialize and configure the chart appearance
    const chartContainer = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(chartContainer, {
        layout: { 
            backgroundColor: '#131722', // Dark background theme
            textColor: '#d1d4dc'        // Light text color
        },
        grid: { 
            vertLines: { color: '#2b2b43' }, 
            horzLines: { color: '#2b2b43' } 
        },
        timeScale: { 
            timeVisible: true, 
            secondsVisible: true // Shows seconds for high-frequency volatility ticks
        }
    });

    // Create the line series for price data tracking
    const lineSeries = chart.addLineSeries({ 
        color: '#26a69a', // Teal line color
        lineWidth: 2 
    });

    // 2. Establish connection to Deriv WebSocket API
    const APP_ID = '1089'; 
    const ws = new WebSocket(`wss://://derivws.com{APP_ID}`);

    // Subscribe to Volatility 10 (1S) index once the connection opens
    ws.onopen = function() {
        console.log("WebSocket connection established successfully.");
        
        const request = {
            ticks: '1HZ10V', // Market symbol for Volatility 10 (1S)
            subscribe: 1     // 1 means continuous stream subscription
        };
        ws.send(JSON.stringify(request));
    };

    // Handle incoming real-time market data packets
    ws.onmessage = function(msg) {
        const data = JSON.parse(msg.data);
        
        // Validate if the incoming packet contains tick data
        if (data.tick) {
            const price = data.tick.quote; // Latest market price
            const time = data.tick.epoch;   // Timestamp in seconds (Unix epoch)

            // Dynamic updates for the charting library line graph
            lineSeries.update({
                time: time,
                value: price
            });
        }
    };

    // Log errors for debugging purposes
    ws.onerror = function(error) {
        console.error("Deriv WebSocket Error details:", error);
    };

    // Auto-reload backup protocol if connection drops out mid-stream
    ws.onclose = function() {
        console.log("WebSocket stream closed. Attempting reconnect protocol in 5 seconds...");
        setTimeout(() => {
            window.location.reload();
        }, 5000);
    };
</script>
