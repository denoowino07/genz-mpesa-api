<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform - GenzTrending.com</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #0c1017;
            --card-bg: #161d26;
            --primary-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #8492a6;
            --border-color: #242f3d;
            --accent-blue: #2196f3;
            --danger-red: #ff4a4a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); font-size: 14px; padding-bottom: 70px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #11171f; border-bottom: 1px solid var(--border-color); }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .account-badge { background-color: #1e293b; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; border: 1px solid var(--border-color); }
        .btn-action { color: #000; font-weight: 700; padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; border: none; cursor: pointer; }
        
        .trade-tabs { display: flex; gap: 8px; padding: 12px 15px; overflow-x: auto; }
        .tab-btn { background-color: #1c2633; color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .market-info-box { padding: 0 15px 10px 15px; }
        .asset-tag { background: #161d26; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .price-container { display: flex; align-items: center; gap: 10px; }
        .asset-price { font-size: 28px; font-weight: 800; font-family: monospace; }
        .trend-arrow { font-size: 24px; font-weight: bold; transition: 0.2s; }
        
        .stake-section { background-color: #161d26; padding: 20px; border-radius: 16px 16px 0 0; margin-top: 40px; position: fixed; bottom: 0; left: 0; width: 100%; border-top: 1px solid var(--border-color); }
        .amount-control { display: flex; justify-content: space-between; align-items: center; background-color: #0c1017; border: 1px solid var(--border-color); border-radius: 8px; padding: 5px; margin-bottom: 15px; }
        .amt-btn { background: #1c2633; border: none; color: #ff9100; font-size: 20px; font-weight: 700; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; }
        .amt-val { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: 700; text-align: center; width: 100%; outline: none; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-trade { border: none; padding: 18px; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.1s; }
        .btn-trade:active { transform: scale(0.98); }
        
        .pnl-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="account-badge">
                <select id="account-type" onchange="updateBalanceDisplay()" style="background:transparent; color:#ffa726; border:none; font-weight:800; outline:none; cursor:pointer; font-size:14px;">
                    <option value="demo" style="background:#161d26; color:#fff;">Demo (D)</option>
                    <option value="real" style="background:#161d26; color:#fff;">Real (R)</option>
                </select>
                <span id="wallet-balance">$10,000.00</span>
            </div>
            <button class="btn-action" style="background-color: var(--primary-green);" onclick="triggerDeposit()">DEPOSIT</button>
            <button class="btn-action" style="background-color: #e2e8f0; color: #000;" onclick="triggerWithdraw()">WITHDRAW</button>
        </div>
    </header>

    <div class="trade-tabs">
        <button class="tab-btn">Matches/Differs</button>
        <button class="tab-btn" style="background:#2b394a; color:#fff;">Even/Odd</button>
        <button class="tab-btn">Over/Under</button>
    </div>

    <!-- Live Running Price and Arrows -->
    <div class="market-info-box">
        <div class="asset-tag">
            <div>
                <span style="font-size: 12px; color: var(--text-muted); display: block;">VOLATILITY 10 (1S) INDEX</span>
                <div class="price-container">
                    <span class="asset-price" id="live-price">9379.00</span>
                    <span class="trend-arrow" id="live-arrow">▲</span>
                </div>
            </div>
            <div style="text-align: right;">
                <span style="font-size: 11px; color: var(--text-muted);">Ticks Analysis</span>
                <div style="font-size: 14px; font-weight: 700; color: var(--primary-green);" id="tick-counter">Tick: 5</div>
            </div>
        </div>
    </div>

    <!-- Control panel and Trade buttons -->
    <div class="stake-section">
        <div class="pnl-row">
            <span style="color: var(--text-muted);">Payout: <span style="color: var(--primary-green);">+95%</span></span>
            <span id="pnl-display" style="color: #fff;">Last Trade: $0.00</span>
        </div>

        <div class="amount-control">
            <button class="amt-btn" onclick="adjustAmount(-1)">−</button>
            <input type="number" class="amt-val" id="trade-amount" value="10">
            <button class="amt-btn" onclick="adjustAmount(1)">+</button>
        </div>

        <div class="action-btns">
            <button class="btn-trade" style="background-color: var(--primary-green); color: #000;" onclick="executeLiveTrade('BUY')">▲ BUY (Higher)</button>
            <button class="btn-trade" style="background-color: var(--danger-red); color: #fff;" onclick="executeLiveTrade('SELL')">▼ SELL (Lower)</button>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('tradeUserId');

        // Mfumo wa Ticks na Namba Zinazokimbia kwa Kasi (Mishale ya Green na Red)
        let currentPrice = 9379.00;
        setInterval(() => {
            let change = (Math.random() - 0.5) * 6; 
            let oldPrice = currentPrice;
            currentPrice += change;

            const priceElement = document.getElementById('live-price');
            const arrowElement = document.getElementById('live-arrow');

            if(priceElement && arrowElement) {
                priceElement.innerText = currentPrice.toFixed(2);

                if(currentPrice > oldPrice) {
                    priceElement.style.color = "var(--primary-green)";
                    arrowElement.innerText = "▲";
                    arrowElement.style.color = "var(--primary-green)";
                } else {
                    priceElement.style.color = "var(--danger-red)";
                    arrowElement.innerText = "▼";
                    arrowElement.style.color = "var(--danger-red)";
                }
            }
            
            const tickElement = document.getElementById('tick-counter');
            if(tickElement) {
                tickElement.innerText = "Tick: " + Math.floor(Math.random() * 10);
            }
        }, 300); // Kasi kubwa sana kila baada ya milisekunde 300

        // Kupakia na kutenganisha Salio la Wateja (Real vs Demo)
        function updateBalanceDisplay() {
            if(!userId) return;
            fetch(`/api/user/${userId}`)
            .then(res => res.json())
            .then(data => {
                const type = document.getElementById('account-type').value;
                const bal = type === 'real' ? data.realBalance : data.demoBalance;
                document.getElementById('wallet-balance').innerText = '$' + bal.toFixed(2);
            })
            .catch(err => {
                // Ikitokea faili halijapata jibu la haraka la seva
                const type = document.getElementById('account-type').value;
                document.getElementById('wallet-balance').innerText = type === 'real' ? '$0.00' : '$10,000.00';
            });
        }
        window.addEventListener('DOMContentLoaded', updateBalanceDisplay);

        // Kazi ya Kununua na Kuuza (Buy/Sell Logic)
        function executeLiveTrade(direction) {
            const accountType = document.getElementById('account-type').value;
            const amount = parseFloat(document.getElementById('trade-amount').value);
            
            document.getElementById('pnl-display').innerText = "Analyzing Tick...";
            document.getElementById('pnl-display').style.color = "#ffb700";

            fetch('/api/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, accountType, amount, direction })
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) { alert(data.error); return; }
                
                const pnlText = document.getElementById('pnl-display');
                if(data.result === 'WIN') {
                    pnlText.innerText = `WIN: +$${data.pnl.toFixed(2)}`;
                    pnlText.style.color = "var(--primary-green)";
                } else {
