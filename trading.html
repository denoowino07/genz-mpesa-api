<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        
        /* Mipangilio ya Sanduku la Grafu */
        .iframe-container {
            width: 100%;
            max-width: 800px;
            height: 550px;
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title">Volatility 10 (1S) Index Live Chart</div>

    <!-- Hapa ndipo link mpya ya SmartTrader ilipo -->
    <div class="iframe-container">
        <iframe src="https://deriv.com" allow="autoplay"></iframe>
    </div>

</body>
</html>
