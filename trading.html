<!-- Futa msimbo wa zamani wa Tawk.to na uweke huu -->
<script>
    // Kufungua muunganisho wa soko la Deriv
    const socket = new WebSocket('wss://://derivws.com');

    socket.onopen = function(evt) {
        console.log("Umeunganishwa na soko la Deriv!");
        // Kuomba data ya bei ya Volatility 10 (1S) Index moja kwa moja
        socket.send(JSON.stringify({ ticks: "1HZ10V" }));
    };

    socket.onmessage = function(msg) {
        const data = JSON.parse(msg.data);
        
        // Mfumo ukipokea bei mpya kila sekunde
        if (data.msg_type === 'tick' && data.tick) {
            const beiYaSasa = data.tick.quote;
            
            // Hapa tunabadilisha lile neno "Loading price..." na kuweka bei halisi ya soko
            const beiElement = document.getElementById("loading-price-id"); 
            if(beiElement) {
                beiElement.innerText = "$" + beiYaSasa;
                beiElement.style.color = "#00ff00"; // Inabadilika kuwa ya kijani ikisoma
            }
            console.log("Bei ya sasa hivi: ", beiYaSasa);
        }
    };

    socket.onerror = function(err) {
        console.error("Hitilafu ya soko: ", err);
    };
</script>
