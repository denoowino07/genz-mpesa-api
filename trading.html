<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        
        .trading-box {
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            padding: 20px;
            width: 95%;
            max-width: 850px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        /* Box la Chati */
        .chart-frame-wrapper {
            width: 100%;
            height: 500px;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2d3748;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .deposit-btn {
            background-color: #00ff00;
            color: #0b0e14;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title">Volatility 10 (1S) Index Real-Time Tracker</div>

    <div class="trading-box">
        <div style="color: #00ff00; font-weight: bold;">Market Status: Active</div>
        
        <!-- Chati ya TradingView -->
        <div class="chart-frame-wrapper">
            <iframe src="https://tradingview.com"></iframe>
        </div>

        <a href="#" class="deposit-btn">Click to DEPOSIT</a>
    </div>

</body>
</html>
