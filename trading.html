<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform - GenzTrending.com</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg-color: #050b14; --card-bg: #0b1528; --primary-color: #00ff87; --text-main: #ffffff; --text-muted: #8fa0b5; --border-color: #1e293b; --red-color: #ff4a4a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px 5%; }
        .account-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px 24px; border-radius: 12px; margin-bottom: 20px; }
        .account-selector { background: #030811; border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .trading-container { display: grid; grid-template-columns: 2.5fr 1fr; gap: 20px; }
        @media (max-width: 990px) { .trading-container { grid-template-columns: 1fr; } }
        .trading-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; }
        .chart-box { height: 450px; background: #030811; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .control-panel { display: flex; flex-direction: column; gap: 20px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .trade-inputs { display: flex; flex-direction: column; gap: 10px; }
        .trade-inputs label { font-size: 12px; color: var(--text-muted); text-align: left; }
        .trade-inputs input, .trade-inputs select { background: #030811; border: 1px solid var(--border-color); padding: 12px; color: #fff; border-radius: 8px; font-size: 16px; width: 100%; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-buy { background-color: var(--primary-color); color: #000; border: none; padding: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }
        .btn-sell { background-color: var(--red-color); color: #fff; border: none; padding: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="account-bar">
        <div>
            <label style="font-size: 11px; color: var(--text-muted); display:block;">Account Type</label>
            <select class="account-selector" id="account-type" onchange="toggleAccountType()">
                <option value="demo">Demo Account</option>
                <option value="real">Real Account (Live)</option>
            </select>
        </div>
        <div style="text-align: right;">
            <label style="font-size: 11px; color: var(--text-muted); display:block;">Your Balance</label>
            <strong style="font-size: 22px; color: var(--primary-color);" id="wallet-balance">$10,000.00</strong>
        </div>
    </div>

    <div class="trading-container">
        <div class="trading-card">
            <h3 style="margin-bottom: 15px;" id="chart-title">BTC/USD Demo Trading Environment</h3>
            <div class="chart-box">
                <div id="tradingview_chart" style="height:100%;width:100%;"></div>
            </div>
        </div>

        <div class="control-panel trading-card">
            <h3>Place Order</h3>
            <hr style="border-color: var(--border-color); margin: 10px 0;">
            <div class="trade-inputs">
                <label>Select Asset</label>
                <select id="asset-selector" onchange="loadChart(this.value)">
                    <option value="BINANCE:BTCUSDT">Bitcoin (BTC/USDT)</option>
                    <option value="BINANCE:ETHUSDT">Ethereum (ETH/USDT)</option>
                    <option value="FX:EURUSD">Euro / US Dollar (EUR/USD)</option>
                </select>
                <label>Amount to Invest ($)</label>
                <input type="number" id="trade-amount" value="10">
                <label>Contract Duration</label>
                <select id="trade-time">
                    <option value="1m">1 Minute</option>
                    <option value="5m">5 Minutes</option>
                </select>
            </div>
            <div class="stat-row">
                <span style="color: var(--text-muted);">Potential Return:</span>
                <span style="color: var(--primary-color); font-weight:700;">+95% Payout</span>
            </div>
            <div class="action-btns">
                <button class="btn-buy" onclick="executeTrade('HIGHER')">▲ BUY</button>
                <button class="btn-sell" onclick="executeTrade('LOWER')">▼ SELL</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://tradingview.com"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => { loadChart("BINANCE:BTCUSDT"); });
        function loadChart(symbol) {
            if (typeof TradingView !== 'undefined') {
                new TradingView.widget({
                    "width": "100%", "height": "100%", "symbol": symbol, "interval": "1",
                    "theme": "dark", "style": "1", "locale": "en", "container_id": "tradingview_chart"
                });
            }
        }
        let balances = { demo: 10000.00, real: 0.00 };
        function toggleAccountType() {
            const type = document.getElementById('account-type').value;
            document.getElementById('wallet-balance').innerText = '$' + balances[type].toFixed(2);
            document.getElementById('wallet-balance').style.color = type === 'real' ? '#00ff87' : '#ffb700';
            document.getElementById('chart-title').innerText = type === 'real' ? 'BTC/USD Real Account Market' : 'BTC/USD Demo Trading Environment';
        }
        function executeTrade(direction) {
            const type = document.getElementById('account-type').value;
            const amount = parseFloat(document.getElementById('trade-amount').value);
            if(isNaN(amount) || amount <= 0) { alert("Please enter a valid amount!"); return; }
            if(amount > balances[type]) { alert("Insufficient funds!"); return; }
            balances[type] -= amount;
            toggleAccountType();
            alert(`${direction} order of $${amount} successfully placed on your ${type.toUpperCase()} account!`);
        }
    </script>
</body>
</html>
