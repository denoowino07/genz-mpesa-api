<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        .trading-box {
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }
        .price-display {
            font-size: 3rem;
            font-weight: bold;
            color: #ff4a5a;
            margin: 20px 0;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }
        .status-badge {
            background-color: #222b3c;
            color: #ffaa00;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title">Volatility 10 (1S) Index Live Market</div>

    <div class="trading-box">
        <div class="status-badge" id="connection-status">Inajunganisha na soko...</div>
        <div class="price-display" id="loading-price-id">Loading price...</div>
        <p style="color: #8a919e; font-size: 0.9rem;">Bei inajisasisha kila sekunde moja</p>
    </div>

    <script>
        // Hapa nimekuwekea ile tokeni yako tayari kabisa!
        const DERIV_TOKEN_YAKO = "188dd1a91d72c1400dae14838aaa84f0afa10008f3a813b9b1f7bfa1dc1f1e69";
        
        const socket = new WebSocket('wss://://derivws.com');
        const statusElement = document.getElementById("connection-status");
        const priceElement = document.getElementById("loading-price-id");

        socket.onopen = function(evt) {
            statusElement.innerText = "Inathibitisha Akaunti...";
            socket.send(JSON.stringify({ authorize: DERIV_TOKEN_YAKO }));
        };

        let beiYaZamani = 0;
        socket.onmessage = function(msg) {
            const data = JSON.parse(msg.data);
            
            if (data.msg_type === 'authorize') {
                if (data.error) {
                    statusElement.innerText = "Tokeni Sio Sahihi au Imezimwa!";
                    statusElement.style.color = "#ff4a5a";
                } else {
                    statusElement.innerText = "Akaunti Imethibitishwa! Soko Liko Wazi";
                    statusElement.style.color = "#00ff00";
                    socket.send(JSON.stringify({ ticks: "1HZ10V" }));
                }
            }
            
            if (data.msg_type === 'tick' && data.tick) {
                const beiYaSasa = data.tick.quote;
                priceElement.innerText = "$" + parseFloat(beiYaSasa).toFixed(2);
                
                if (beiYaSasa > beiYaZamani) {
                    priceElement.style.color = "#00ff00"; 
                } else if (beiYaSasa < beiYaZamani) {
                    priceElement.style.color = "#ff4a5a"; 
                }
                beiYaZamani = beiYaSasa;
            }
        };

        socket.onerror = function(err) {
            statusElement.innerText = "Hitilafu ya Muunganisho!";
            statusElement.style.color = "#ff4a5a";
        };

        socket.onclose = function() {
            statusElement.innerText = "Muunganisho Umefungwa.";
            statusElement.style.color = "#ff4a5a";
        };
    </script>

</body>
</html>
