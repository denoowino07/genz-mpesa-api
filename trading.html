<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform - GenzTrending</title>
    <!-- Pakia maktaba ya TradingView Lightweight Charts kutoka CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #131722;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header-status {
            display: flex;
            justify-content: space-between;
            background: #1c2030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        #chart-container {
            width: 100%;
            height: 450px;
            background-color: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
        }
        .trade-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }
        .btn-buy { background-color: #00c853; }
        .btn-sell { background-color: #ff3d00; }
        #price-display {
            font-size: 24px;
            font-weight: bold;
        }
        .up-trend { color: #00c853; }
        .down-trend { color: #ff3d00; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-status">
        <div>VOLATILITY 10 (1S) INDEX</div>
        <div id="price-display">Inapakia bei...</div>
    </div>

    <!-- Hapa ndipo chati itakapochorwa kiotomatiki -->
    <div id="chart-container"></div>

    <div class="trade-buttons">
        <button class="btn btn-buy">▲ BUY (Higher)</button>
        <button class="btn btn-sell">▼ SELL (Lower)</button>
    </div>
</div>

<script>
    // 1. Sanidi Muonekano wa Chati ya TradingView
    const container = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(container, {
        layout: {
            background: { type: 'solid', color: '#131722' },
            textColor: '#d1d4dc',
        },
        grid: {
            vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
            horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: 'rgba(197, 203, 206, 0.8)' },
        timeScale: { borderColor: 'rgba(197, 203, 206, 0.8)', timeVisible: true, secondsVisible: true },
    });

    // 2. Tengeneza mstari wa chati (Area Series kwa muonekano mzuri wa mtindo wa kivuli)
    const areaSeries = chart.addAreaSeries({
        topColor: 'rgba(33, 150, 243, 0.56)',
        bottomColor: 'rgba(33, 150, 243, 0.04)',
        lineColor: 'rgba(33, 150, 243, 1)',
        lineWidth: 2,
    });

    // Weka data za mwanzo kama mfano ili chati isianze tupu
    let lastPrice = 9379.00;
    let initialTime = Math.floor(Date.now() / 1000) - 60;
    let dataMock = [];
    for (let i = 0; i < 60; i++) {
        lastPrice += (Math.random() - 0.5) * 2;
        dataMock.push({ time: initialTime + i, value: lastPrice });
    }
    areaSeries.setData(dataMock);

    // 3. Unganisha na Live WebSocket API ya Deriv/Binary ili kupata ticks halisi za sekunde 1
    // UKUMBUSHO: Badilisha 'app_id=1089' na App ID yako rasmi ya Deriv ukipenda kulive nayo
    const ws = new WebSocket('wss://://derivws.com');

    ws.onopen = function() {
        // Tuma ombi la kuanza kusikiliza bei ya Volatility 10 (1s) Index mara moja
        const request = JSON.stringify({
            ticks: "1HZ10V", // Hii ndio kodi ya Volatility 10 (1s) Index
            subscribe: 1
        });
        ws.send(request);
    };

    const priceDisplay = document.getElementById('price-display');

    ws.onmessage = function(msg) {
        const data = JSON.parse(msg.data);
        
        if (data.tick) {
            const tick = data.tick;
            const currentPrice = parseFloat(tick.quote);
            const currentTime = parseInt(tick.epoch);

            // Sasisha namba ya bei kwenye kioo
            if (currentPrice >= lastPrice) {
                priceDisplay.className = 'up-trend';
                priceDisplay.innerHTML = `${currentPrice.toFixed(2)} ▲`;
            } else {
                priceDisplay.className = 'down-trend';
                priceDisplay.innerHTML = `${currentPrice.toFixed(2)} ▼`;
            }

            // Sukuma data mpya kwenye chati mubashara kila baada ya sekunde 1
            areaSeries.update({
                time: currentTime,
                value: currentPrice
            });

            lastPrice = currentPrice;
        }
    };

    ws.onerror = function(err) {
        console.error("Shida ya mawasiliano na seva ya chati: ", err);
    };

    // Fanya chati ijinyooshe kiotomatiki pindi kioo kikibadilika ukubwa
    window.addEventListener('resize', () => {
        chart.resize(container.clientWidth, 450);
    });
</script>
</body>
</html>
