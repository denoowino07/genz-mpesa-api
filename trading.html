<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenzTrading.com - Professional Portal</title>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .header-bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222b3c; }
        .logo { color: #00bfff; font-weight: bold; font-size: 1.2rem; }
        
        .account-switcher { display: flex; background-color: #151a24; border-radius: 6px; padding: 3px; border: 1px solid #222b3c; }
        .acc-tab { padding: 5px 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; border-radius: 4px; color: #8a919e; }
        .acc-tab.active-demo { background-color: #ff4a5a; color: #ffffff; }
        .acc-tab.active-real { background-color: #00ff00; color: #0b0e14; }
        
        .balance-display { font-weight: bold; font-size: 0.9rem; margin-left: 5px; background-color: #151a24; padding: 5px 8px; border-radius: 6px; border: 1px solid #222b3c; color: #ffaa00; }
        .top-deposit-btn { background-color: #00ff00; color: #0b0e14; padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 5px; }

        .market-modes { display: flex; justify-content: space-around; width: 100%; max-width: 480px; margin: 15px 0; gap: 5px; }
        .mode-tab { background-color: #151a24; padding: 8px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; border: 1px solid #222b3c; color: #8a919e; }
        .mode-tab.active { background-color: #00bfff; color: #ffffff; border-color: #00bfff; }

        .trading-box { background-color: #151a24; border: 1px solid #222b3c; border-radius: 12px; padding: 15px; width: 95%; max-width: 480px; box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5); }
        
        .chart-box { background-color: #0b0e14; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px; border: 1px solid #222b3c; }
        .price-badge { font-size: 2.2rem; font-weight: bold; margin: 5px 0; color: #ffffff; }
        
        /* MPANGILIO WA DIGITS NA PERCENTAGES KAMA PICHA YAKO */
        .ticker-container { display: flex; justify-content: center; gap: 4px; margin-top: 15px; overflow-x: auto; }
        .tick-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tick-circle { width: 28px; height: 28px; border-radius: 50%; background-color: #222b3c; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; }
        .percentage-lbl { font-size: 0.7rem; color: #8a919e; font-weight: bold; }
        
        #chart-canvas { width: 100%; height: 180px; background-color: #0b0e14; margin-top: 10px; }

        .execution-modes { display: flex; width: 100%; gap: 10px; margin-bottom: 15px; }
        .exec-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; background-color: #222b3c; color: #ffffff; }
        .exec-btn.active { background-color: #00ff00; color: #0b0e14; }

        .stake-box { display: flex; align-items: center; justify-content: center; gap: 15px; background-color: #0b0e14; padding: 10px; border-radius: 8px; border: 1px solid #222b3c; margin-bottom: 15px; }
        .stake-input { background: none; border: none; color: #ffffff; font-size: 1.5rem; width: 80px; text-align: center; font-weight: bold; }
        .math-btn { background-color: #222b3c; color: #ffffff; border: none; width: 35px; height: 35px; border-radius: 6px; font-size: 1.2rem; cursor: pointer; }

        /* MODAL / SEHEMU YA POPUP YA M-PESA */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background-color: #151a24; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #222b3c; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #8a919e; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d3748; background-color: #0b0e14; color: #ffffff; box-sizing: border-box; }
        .close-btn { background-color: #ff4a5a; color: white; padding: 10px; border: none; border-radius: 6px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo">GenzTrading.com</div>
        <div style="display: flex; align-items: center;">
            <div class="account-switcher">
                <div class="acc-tab active-demo" id="tab-demo" onclick="switchAccount('demo')">DEMO</div>
                <div class="acc-tab" id="tab-real" onclick="switchAccount('real')">REAL</div>
            </div>
            <div class="balance-display" id="balance-txt">$ 10,000.00</div>
            <button class="top-deposit-btn" onclick="openMpesaBox()">DEPOSIT</button>
        </div>
    </div>

    <div class="market-modes">
        <div class="mode-tab" id="tab-differs" onclick="switchMarketMode('differs')">Matches/Differs</div>
        <div class="mode-tab active" id="tab-even" onclick="switchMarketMode('even')">Even/Odd</div>
        <div class="mode-tab" id="tab-under" onclick="switchMarketMode('under')">Over/Under</div>
    </div>

    <div class="trading-box">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #8a919e; margin-bottom: 5px;">
            <span id="market-display">Volatility 10 (1S) - EVEN/ODD</span>
            <span style="color: #00ff00;">● Live Market Active</span>
        </div>

        <div class="chart-box">
            <div style="font-size: 0.9rem; color: #8a919e;">VOL 10 (1S)</div>
            <div class="price-badge" id="live-price">9379.60</div>
            <canvas id="chart-canvas"></canvas>
            
            <!-- VIDOTI VYA NAMBA NA ASILIMIA (%) KAMA PICHA YA SIMU YAKO -->
            <div class="ticker-container" id="ticker-box">
                <div class="tick-wrapper"><div class="tick-circle">0</div><div class="percentage-lbl">12%</div></div>
                <div class="tick-wrapper"><div class="tick-circle">1</div><div class="percentage-lbl">8%</div></div>
                <div class="tick-wrapper"><div class="tick-circle">2</div><div class="percentage-lbl">10%</div></div>
                <div class="tick-wrapper"><div class="tick-circle">3</div><div class="percentage-lbl">11%</div></div>
                <div class="tick-wrapper"><div class="tick-circle">4</div><div class="percentage-lbl">9%</div></div>
                <div class="tick-wrapper"><div class="tick-circle">5</div><div class="percentage-lbl">13%</div></div>
                <div class="tick-wrapper"><div class="tick-circle">6</div><div class="percentage-lbl">7%</div></div>
                <div class="tick-wrapper"><div class="tick-circle">7</div><div class="percentage-lbl">11%</div></div>
                <div class="tick-wrapper"><div class="tick-circle">8</div><div class="percentage-lbl">9%</div></div>
            </div>
        </div>

        <div class="execution-modes">
            <button class="exec-btn" id="btn-auto" onclick="switchExecMode('auto')">AUTO</button>
            <button class="exec-btn active" id="btn-manual" onclick="switchExecMode('manual')">MANUAL</button>
        </div>

        <div class="stake-box">
            <button class="math-btn" onclick="adjustStake(-1)">-</button>
            <span style="color: #8a919e; font-size: 1.2rem;">$</span>
            <input type="number" class="stake-input" id="stake-value" value="10" readonly>
            <button class="math-btn" onclick="adjustStake(1)">+</button>
        </div>
    </div>

    <!-- SEHEMU YA POPUP YA M-PESA (DEPOSIT GATEWAY) -->
    <div class="modal" id="mpesa-modal">
        <div class="modal-content">
            <img src="https://wikimedia.org" style="height: 35px; margin-bottom: 15px;">
            <h2>M-Pesa Secure Deposit</h2>
            <form onsubmit="runPayment(event)">
                <div class="form-group">
                    <label>M-Pesa Phone Number</label>
                    <input type="tel" id="phone" value="2547" required>
                </div>
                <div class="form-group">
                    <label>Amount (Ksh)</label>
                    <input type="number" id="amount" placeholder="Min 100 Ksh" min="100" required>
                </div>
                <button type="submit" class="top-deposit-btn" style="width:100%; padding:12px; font-size:1rem;">Send M-Pesa STK Push</button>
            </form>
            <div id="pay-status" style="margin-top:10px; font-weight:bold; font-size:0.9rem;"></div>
            <button class="close-btn" onclick="closeMpesaBox()">Cancel / Close</button>
        </div>
    </div>

    <script>
        let currentAccount = 'demo';
        
        function switchAccount(type) {
            currentAccount = type;
            const demoTab = document.getElementById('tab-demo');
            const realTab = document.getElementById('tab-real');
            const balanceTxt = document.getElementById('balance-txt');
            demoTab.className = 'acc-tab'; realTab.className = 'acc-tab';
            
            if(type === 'demo') {
                demoTab.classList.add('active-demo'); balanceTxt.innerText = "$ 10,000.00"; balanceTxt.style.color = "#ffaa00";
            } else {
