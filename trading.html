<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform - Deposit</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        
        .trading-box {
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            padding: 30px 20px;
            width: 95%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Muonekano wa Fomu ya M-Pesa */
        .form-group {
            text-align: left;
            margin-bottom: 15px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #8a919e;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2d3748;
            background-color: #0b0e14;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #00ff00;
            outline: none;
        }

        .pay-btn {
            width: 90%;
            background-color: #00ff00;
            color: #0b0e14;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .pay-btn:hover {
            background-color: #00cc00;
        }

        #payment-status {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title">M-Pesa Secure Deposit Gateway</div>

    <div class="trading-box">
        <div style="margin-bottom: 20px;">
            <img src="https://wikimedia.org" alt="M-Pesa" style="height: 45px;">
        </div>

        <!-- FOMU YA SAFARICOM M-PESA -->
        <form id="mpesa-form" onsubmit="processPayment(event)">
            <div class="form-group">
                <label for="phone">M-Pesa Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g., 254712345678" required>
            </div>

            <div class="form-group">
                <label for="amount">Amount to Deposit (Ksh)</label>
                <input type="number" id="amount" placeholder="Minimum 100 Ksh" min="100" required>
            </div>

            <button type="submit" class="pay-btn">Initiate M-Pesa Deposit</button>
        </form>

        <div id="payment-status"></div>
    </div>

    <script>
        function processPayment(event) {
            event.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const statusDiv = document.getElementById('payment-status');

            statusDiv.style.color = "#ffaa00";
            statusDiv.innerText = "Sending STK Push prompt to your phone...";

            // HAPA NDIPO SIMU INAPOUNGANISHWA NA MFUMO WA BACKEND WA DARJA API
            // Inatuma data kwenda kwenye mfumo wako wa nyuma ulioopo Render
            fetch('/api/mpesa/stkpush', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ phone: phone, amount: amount })
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    statusDiv.style.color = "#00ff00";
                    statusDiv.innerText = "Prompt sent successfully! Enter your M-Pesa PIN on your phone.";
                } else {
                    statusDiv.style.color = "#ff4a5a";
                    statusDiv.innerText = "Payment failed to initiate. Please try again.";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                // Mfano wa majaribio ya mbele kama API bado haijaunganishwa nyuma:
                statusDiv.style.color = "#00ff00";
                statusDiv.innerText = "Simulated Request: M-Pesa STK Push sent to " + phone + " for Ksh " + amount;
            });
        }
    </script>

</body>
</html>
