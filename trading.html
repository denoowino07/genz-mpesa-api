<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenzTrending - Trading Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b111e;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* Sehemu ya Juu (Header) */
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo {
            font-weight: bold;
            font-size: 20px;
        }
        .logo span { color: #00e676; }
        .balance-box {
            text-align: right;
        }
        .balance-title {
            font-size: 12px;
            color: #94a3b8;
        }
        .balance-amount {
            font-size: 22px;
            font-weight: bold;
            color: #00e676;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .deposit-btn {
            background-color: #00e676;
            color: #0b111e;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }

        /* Muundo Mkuu wa Ukurasa */
        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .market-title {
            font-size: 16px;
            font-weight: bold;
            color: #cbd5e1;
        }

        /* Eneo la Chati Mpya Iliyorekebishwa */
        .chart-wrapper {
            width: 100%;
            height: 380px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Jedwali la Taarifa za Soko (Grid ya Chini) */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .info-label {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .info-value {
            font-size: 14px;
            font-weight: bold;
            color: #f8fafc;
        }

        /* Sehemu ya Biashara (Vitufe na Kiasi) */
        .trading-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .amount-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .amount-btn {
            background: none;
            border: none;
            color: #00e676;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 30px;
        }
        .amount-input {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            width: 80px;
            outline: none;
        }
        .payout-text {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }
        .payout-text span {
            color: #00e676;
            font-weight: bold;
        }

        /* Vitufe Kuu vya BUY na SELL */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .trade-btn {
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: #0b111e;
        }
        .trade-btn:active {
            transform: scale(0.98);
        }
        .buy-btn {
            background-color: #00e676;
        }
        .sell-btn {
            background-color: #ff3d00;
            color: #ffffff;
        }

        /* Responsive kwa ajili ya Simu */
        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr 1fr;
            }
            .chart-wrapper {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- Sehemu ya Juu -->
    <header>
        <div class="logo">⚡ <span>Genz</span>Trending</div>
        <div class="balance-box">
            <div class="balance-title">DEMO BALANCE</div>
            <div class="balance-amount" id="account-balance">$10,000.00</div>
        </div>
        <div class="header-buttons">
            <button class="deposit-btn" onclick="alert('M-PESA Deposit feature coming soon!')">DEPOSIT</button>
        </div>
    </header>

    <!-- Muundo Mkuu -->
    <div class="main-container">
        
        <div class="market-header">
            <div class="market-title">📈 VOLATILITY 10 INDEX (LIVE FEEDS)</div>
        </div>

        <!-- ENEO LA CHATI MPYA ILIYOREKEBISHWA (TRADINGVIEW IFRAME) -->
        <div class="chart-wrapper">
            <iframe 
                src="https://tradingview.com" 
                style="width: 100%; height: 100%; border: none;">
            </iframe>
        </div>

        <!-- Grid ya Taarifa za Miamala -->
        <div class="info-grid">
            <div class="info-card"><div class="info-label">2</div><div class="info-value" style="color:#ff3d00;">10%</div></div>
            <div class="info-card"><div class="info-label">4</div><div class="info-value" style="color:#00e676;">40%</div></div>
            <div class="info-card"><div class="info-label">7</div><div class="info-value" style="color:#ff3d00;">10%</div></div>
            <div class="info-card"><div class="info-label">8</div><div class="info-value" style="color:#00e676;">40%</div></div>
        </div>

        <!-- Sehemu ya Vitufe vya Biashara -->
        <div class="trading-panel">
            
            <div class="payout-text">Payout Rate: <span>+95%</span></div>

            <div class="amount-selector">
                <button class="amount-btn" id="minus-btn">−</button>
                <div>
                    <span style="color:#64748b; font-size:12px; display:block; text-align:center;">STAKE ($)</span>
                    <input type="text" class="amount-input" id="stake-amount" value="10" readonly>
                </div>
                <button class="amount-btn" id="plus-btn">+</button>
            </div>

            <div class="action-buttons">
                <button class="trade-btn buy-btn" id="buy-action">▲ BUY</button>
                <button class="trade-btn sell-btn" id="sell-action">▼ SELL</button>
            </div>

        </div>

    </div>

    <!-- UBONGOHALISI (JAVASCRIPT) WA KUENDESHA VILE VITUFE -->
    <script>
        let currentBalance = 10000.00;
        let stakeAmount = 10;

        const balanceEl = document.getElementById('account-balance');
        const stakeEl = document.getElementById('stake-amount');

        // 1. Kitufe cha kuongeza kiwango cha kuweka (Stake)
        document.getElementById('plus-btn').addEventListener('click', () => {
            stakeAmount += 5;
            stakeEl.value = stakeAmount;
        });

        // 2. Kitufe cha kupunguza kiwango cha kuweka (Stake)
        document.getElementById('minus-btn').addEventListener('click', () => {
            if (stakeAmount > 5) {
                stakeAmount -= 5;
                stakeEl.value = stakeAmount;
            }
        });

        // 3. Amri mteja akibofya BUY au SELL
        function executeTrade(type) {
            if (currentBalance < stakeAmount) {
                alert("Insufficient Demo Balance!");
                return;
            }

            // Kata mtaji wa sasa kwenye salio
            currentBalance -= stakeAmount;
            balanceEl.textContent = "$" + currentBalance.toFixed(2);

            alert("Trade Placed: " + type + " $" + stakeAmount + ". Processing outcome in 5 seconds...");

            // Igiza matokeo baada ya sekunde 5 (Simulate Trade Outcome)
            setTimeout(() => {
                let win = Math.random() > 0.4; // 60% nafasi ya kushinda kwa mfano
                if (win) {
                    let profit = stakeAmount * 1.95; // Mtaji + 95% faida
                    currentBalance += profit;
