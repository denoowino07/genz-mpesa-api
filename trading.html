<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Trading Platform</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00bfff; margin-bottom: 5px; }
        .market-title { color: #8a919e; font-size: 1.1rem; margin-bottom: 20px; }
        
        .trading-box {
            background-color: #151a24;
            border: 2px solid #222b3c;
            border-radius: 12px;
            padding: 30px 20px;
            width: 95%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        label { display: block; margin-bottom: 5px; color: #8a919e; font-size: 0.95rem; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2d3748;
            background-color: #0b0e14;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus { border-color: #00ff00; outline: none; }

        .btn {
            width: 90%;
            background-color: #00bfff;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .deposit-btn { background-color: #00ff00; color: #0b0e14; }
        
        .switch-link {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #00bfff;
            cursor: pointer;
        }

        /* Ficha kurasa ambazo hazitumiki */
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>GENZ TRADING</h1>
    <div class="market-title" id="page-title">Welcome to Genz Trading Portal</div>

    <div class="trading-box">
        
        <!-- 1. UKURASA WA LOGIN -->
        <div id="login-section">
            <h2>Account Login</h2>
            <form onsubmit="showPage(event, 'deposit')">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn">Login to Dashboard</button>
            </form>
            <div class="switch-link" onclick="toggleForm('register')">Don't have an account? Sign Up here</div>
        </div>

        <!-- 2. UKURASA WA REGISTER (SIGN UP) -->
        <div id="register-section" class="hidden">
            <h2>Create Free Account</h2>
            <form onsubmit="showPage(event, 'deposit')">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter official names" required>
                </div>
                <div class="form-group">
                    <label>Phone Number (M-Pesa)</label>
                    <input type="tel" placeholder="e.g. 254712345678" required>
                </div>
                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" placeholder="Minimum 6 characters" required>
                </div>
                <button type="submit" class="btn">Register & Link MT5</button>
            </form>
            <div class="switch-link" onclick="toggleForm('login')">Already have an account? Login here</div>
        </div>

        <!-- 3. UKURASA WA DEPOSIT (M-PESA) -->
        <div id="deposit-section" class="hidden">
            <div style="margin-bottom: 20px;">
                <img src="https://wikimedia.org" alt="M-Pesa" style="height: 40px;">
            </div>
            <h2>Secure M-Pesa Deposit</h2>
            <form onsubmit="simulatePayment(event)">
                <div class="form-group">
                    <label>Confirm M-Pesa Number</label>
                    <input type="tel" id="phone" value="2547" required>
                </div>
                <div class="form-group">
                    <label>Amount to Deposit (Ksh)</label>
                    <input type="number" id="amount" placeholder="Minimum 100 Ksh" min="100" required>
                </div>
                <button type="submit" class="btn deposit-btn">Initiate M-Pesa Deposit</button>
            </form>
            <div id="payment-status" style="margin-top: 15px; font-weight: bold;"></div>
        </div>

    </div>

    <script>
        function toggleForm(page) {
            if(page === 'register') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('register-section').classList.remove('hidden');
            } else {
                document.getElementById('register-section').classList.add('hidden');
                document.getElementById('login-section').classList.remove('hidden');
            }
        }

        function showPage(event, page) {
            event.preventDefault();
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('deposit-section').classList.remove('hidden');
            document.getElementById('page-title').innerText = "Genz Trading Secure Wallet";
        }

        function simulatePayment(event) {
            event.preventDefault();
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const statusDiv = document.getElementById('payment-status');
            
            statusDiv.style.color = "#00ff00";
            statusDiv.innerText = "STK Push sent to " + phone + " for Ksh " + amount + ". Check your phone to enter PIN.";
        }
    </script>

</body>
</html>
